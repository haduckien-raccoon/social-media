name: social-media

services:
  mysql:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sudo_social}
      MYSQL_USER: ${MYSQL_USER:-sudo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sudo_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'cypher-shell -a bolt://127.0.0.1:7687 -u "${NEO4J_USERNAME:-neo4j}" -p "${NEO4J_PASSWORD:-neo4j_password}" "RETURN 1" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env.docker
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: neo4j://neo4j:7687
      DJANGO_SERVE_STATIC: "True"
    command: ["/app/docker/entrypoint.sh", "web"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/images
      - logs_data:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; response=urllib.request.urlopen(''http://127.0.0.1:8080/health/'', timeout=5); sys.exit(0 if response.status == 200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env.docker
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sudo_social}
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password} 
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: neo4j://neo4j:7687
      APP_BASE_URL: http://web:8080
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_SERVE_STATIC: "True"
    command: ["/app/docker/entrypoint.sh", "test"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    profiles:
      - test
    restart: "no"

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  static_data:
  media_data:
  logs_data:
